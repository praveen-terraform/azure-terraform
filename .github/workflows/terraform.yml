name: Terraform Multi-Env

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENABLE_QA: 'false'

jobs:
  validate-dev:
    name: Validate Dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_INPUT: false
      TF_VAR_public_key: ${{ secrets.TF_VAR_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: ${{ vars.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  deploy-dev:
    name: Deploy Dev
    if: github.event_name == 'push'
    needs: validate-dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_INPUT: false
      TF_VAR_public_key: ${{ secrets.TF_VAR_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: ${{ vars.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Apply (Skipped for POC)
        run: |
          # terraform apply -auto-approve
          echo "Terraform apply skipped for POC to avoid Azure cost"

  validate-qa:
    name: Validate QA
    if: github.event_name == 'push' && env.ENABLE_QA == 'true'
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa
    env:
      TF_INPUT: false
      TF_VAR_public_key: ${{ secrets.TF_VAR_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: ${{ vars.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  deploy-qa:
    name: Deploy QA
    if: github.event_name == 'push' && env.ENABLE_QA == 'true'
    needs: validate-qa
    runs-on: ubuntu-latest
    environment: qa
    env:
      TF_INPUT: false
      TF_VAR_public_key: ${{ secrets.TF_VAR_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: ${{ vars.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Apply (Skipped for POC)
        run: |
          # terraform apply -auto-approve
          echo "Terraform apply skipped for POC to avoid Azure cost"
